services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Europe/Athens
      - LOG_LEVEL=info
    ports:
      - target: 8191
        published: "8191"
        protocol: tcp
    restart: unless-stopped
x-casaos:
  store_id: flaresolverr-local
  title:
    en_us: FlareSolverr
